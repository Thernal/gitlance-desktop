[package]
name = "gitlance"
version = "0.2.0"
edition = "2024"
description = "Review commits and force-pushed branch versions on macOS, without an IDE and without worktrees."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
# Image sizes from their headers, for image review (already in GPUI's dependency graph).
imagesize = "0.14"
# GitLab names a diff line by the SHA-1 of its file's path (already in GPUI's graph).
sha1_smol = "1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dates in the local time zone (already in GPUI's dependency graph).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pulldown-cmark = { version = "0.13", default-features = false }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
# GPUI is pre-1.0: pinned to the gpui-pre snapshot of zed@279fe07. An upgrade is its own change.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["runtime_shaders", "font-kit"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
two-face = "0.5"

# Linux windows through X11 and Wayland (features add up with the line above).
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["x11", "wayland"] }

# Whether an agent's process still runs (`platform::alive`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAccessibility", "NSApplication", "NSImage", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[features]
# `GITLANCE_SNAPSHOT=<file.png>` renders the window to a PNG and quits — UI checks without screen access.
snapshot = ["dep:image", "gpui/test-support", "gpui_platform/test-support"]

[dev-dependencies]
tempfile = "3"
