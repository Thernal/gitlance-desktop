<title>Splash example (Velino)</title>
<!--
  The splash. The designer asked for an animated one, pointed at DropNote's and AutoZap's, and said the
  first full screen must be one flat colour.

  From DropNote: one flat colour, no gradient and no shadow; the white screen shrinks into the mark, the
  mark's own parts then appear inside it; motion is springs, never a bezier on a fixed beat ("robotic");
  the loading state IS the mark's own motion on an irregular beat; the name at the foot, no subtitle;
  reduced motion shows the last frame.
  From AutoZap: the review plays slowly on request (the wrapper's "Slow x4"), and the loading is a
  rhythm, not a spinner.

  This file is an EXAMPLE: the mark is Velino's icon (a wallet with the notification shade, two banners, cut out of it). Replace the mark's parts and keep the rest.
  Here it is built from parts so that it can move:

    A   (default) the screen starts as one flat white; it shrinks into the wallet (a stiff spring);
        the card rises from the wallet's mouth; the clasp bites in; two banners drop in from the top
        edge, one after the other, as notifications do; the wallet squashes as each lands; the name
        rises at the foot.
    B   the screen starts as one flat colour (the ground); the white wallet pops in from nothing
        (a springy pop), then the same parts.

    0.0-0.75 s  the shrink (A) or the pop (B)       0.5 s  the card rises, the clasp bites in
    0.7 s       the first banner drops               0.9 s  the second
    1.05 s      their dots pop and their lines draw  1.1 s  the name rises
    2.4 s ->    loading: strong nudge of the top banner, a small one of the second, a long rest, then a
                medium pair (6.4 s, irregular). The wallet answers each with a small squash.

  For the native team: the SYSTEM launch screen must be plain white for A (plain ground colour for B),
  or the hand-over flashes. The ground and the mark are brand literals once the store colour is decided;
  until then the ground follows the accent hue so the slider can be tried. ?stay=1 holds the loop,
  ?slow=4 plays four times slower, ?v=b plays B; tapping the screen replays it.
-->

<script>
/* Plays once, then hands over to the next screen after one loading beat (in the app the hand-over is "ready", not a
   timer). ?stay=1 holds the loop for review (it also holds by itself when the page is inside the wrapper's frame); ?slow=4 plays four times slower; ?v=b plays the colour-first
   version; tapping the screen replays it. The wrapper's strip has the versions and the slow switch. */
var q = new URLSearchParams(location.search), screen = document.getElementById('screen');
var state = { v: q.get('v') === 'b' ? 'b' : 'a', k: Math.max(1, Math.min(8, +q.get('slow') || 1)) };
var stay = q.get('stay') === '1' || window.top !== window, timer;   /* inside the review frame it holds, so the loop can be watched */
function play() {
  screen.classList.remove('play'); screen.classList.toggle('vb', state.v === 'b'); screen.style.setProperty('--k', state.k);
  void screen.offsetWidth; screen.classList.add('play');
  clearTimeout(timer);
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!stay) timer = setTimeout(function () { location.href = 'next.html'; }, (still ? 900 : 3600) * state.k);
}
var STATES = [{ id: 'a', label: 'A · white shrinks' }, { id: 'b', label: 'B · colour first' }, { id: 'a4', label: 'A · slow x4' }, { id: 'b4', label: 'B · slow x4' }];
window.VW = { controls: { states: STATES, current: state.v + (state.k > 1 ? '4' : ''), skip: { label: 'Skip', href: 'next.html' },
  onPick: function (id) { state.v = id[0]; state.k = id.length > 1 ? 4 : 1; stay = true; play(); } } };
screen.addEventListener('click', function () { play(); });
play();
</script>
