name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Also caches, and turns compiler and clippy messages into annotations on the run.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ''

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sh .github/linux-deps.sh

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: |
          # A failing test's name and panic become annotations: the log needs signing in to read.
          set -o pipefail
          cargo test 2>&1 | tee test.log || {
            grep -E "panicked at|^---- |^    [a-z_:]+$|assertion|left:|right:" test.log \
              | head -40 | sed 's/^/::error title=test::/'
            exit 1
          }
